[project]
name = "epds"
version = "0.1.0"
description = "Educational Poster Decimal System"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Karl Wooster", email = "karl@wooster.xyz" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.9",
  "django==6.1.1",
  "django-allauth[mfa]==65.19.4",
  "django-anymail[sendgrid]==15.2",
  "django-compressor==4.6.0",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-ninja==1.7.1",
  "django-redis==7.0.0",
  "django-stubs-ext>=6.1.1",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "pillow==12.3.0",
  "psycopg[c]==3.3.6",
  "python-slugify==9.1.0",
  "redis==8.1.0",
  "sentry-sdk==2.69.2",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.1",
  "coverage==7.16.1",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==8.0.0",
  "django-extensions==4.1",
  "django-types>=0.24.0",
  "django-upgrade==1.32.0",
  "djlint==1.46.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "prek>=0.5.3",
  "psycopg[c]==3.3.6",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.8",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "element,slot"
ignore = "H006,H030,H031"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812",
  "E501",   # the formatter will handle line length, so we can ignore this rule
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "test_*.py",
  "tests.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "epds/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
